[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "remram-cortex"
version = "0.1.0"
description = "Preparation scaffold for the layered Cortex Phase 0 and Phase 1 architecture."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Remram" }
]
dependencies = []

[project.scripts]
remram-cortex = "remram_cortex.cli:main"

[tool.setuptools.packages.find]
include = ["remram_cortex*"]
